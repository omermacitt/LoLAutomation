name: Windows desktop beta

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact version tag from app_meta.py
        required: true
        default: v1.0.1
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - name: Verify update signing configuration
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATE_PUBLIC_KEY: ${{ vars.RUNEPILOT_UPDATE_PUBLIC_KEY }}
        run: |
          if (!$env:UPDATE_PRIVATE_KEY -or !$env:UPDATE_PUBLIC_KEY) { throw 'Configure TAURI_SIGNING_PRIVATE_KEY secret and RUNEPILOT_UPDATE_PUBLIC_KEY variable before building a release.' }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.3'
          cache: pip
          cache-dependency-path: requirements-build-windows.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22.15.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned Python build and test dependencies
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements-build-windows.lock
          .\.venv\Scripts\python.exe -m pip install --no-deps --no-build-isolation -e .
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Select Rust toolchain
        run: rustup override set 1.99.1
      - name: Verify release version and tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: .\.venv\Scripts\python.exe tools/release_version.py --tag $env:RELEASE_TAG
      - name: Python checks
        run: |
          .\.venv\Scripts\python.exe -m pytest
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m ruff check src tests main.py run_app.py backend_main.py tools/release_version.py tools/smoke_backend.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m black --check src tests main.py run_app.py backend_main.py tools/release_version.py tools/smoke_backend.py
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npx playwright install msedge
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run test:e2e
      - name: Build previous native fixture with an owned retired component
        run: |
          git fetch --depth=1 origin 988ab21de236543dd68f9ec1e2a08be2be8d86e2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git worktree add --detach build/upgrade-previous 988ab21de236543dd68f9ec1e2a08be2be8d86e2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $previous = Join-Path $env:GITHUB_WORKSPACE 'build/upgrade-previous'
          New-Item -ItemType Junction -Path "$previous/frontend/node_modules" -Target "$env:GITHUB_WORKSPACE/frontend/node_modules" | Out-Null
          New-Item -ItemType Directory -Force frontend/src-tauri/target | Out-Null
          New-Item -ItemType Junction -Path "$previous/frontend/src-tauri/target" -Target "$env:GITHUB_WORKSPACE/frontend/src-tauri/target" | Out-Null
          $configPath = Join-Path $previous 'frontend/src-tauri/tauri.conf.json'
          $config = Get-Content -Raw -LiteralPath $configPath | ConvertFrom-Json
          $config.bundle | Add-Member -NotePropertyName resources -NotePropertyValue @{ 'owned-old-code.txt' = 'retired/owned-old-code.txt' }
          [IO.File]::WriteAllText($configPath, ($config | ConvertTo-Json -Depth 20), [Text.UTF8Encoding]::new($false))
          [IO.File]::WriteAllText((Join-Path $previous 'frontend/src-tauri/owned-old-code.txt'), 'retired installed component')
          # Keep the modified fixture in the canonical format required by its version gate.
          & "$env:GITHUB_WORKSPACE/.venv/Scripts/python.exe" "$previous/tools/release_version.py" --sync
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$previous/tools/build_desktop.ps1" -Python "$env:GITHUB_WORKSPACE/.venv/Scripts/python.exe"
          Set-Location -LiteralPath $env:GITHUB_WORKSPACE
      - name: Build signed complete Setup and update manifest
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RUNEPILOT_UPDATE_PUBLIC_KEY: ${{ vars.RUNEPILOT_UPDATE_PUBLIC_KEY }}
        run: .\tools\build_desktop.ps1 -SignedUpdates
      - name: Native Rust checks
        run: |
          cargo fmt --manifest-path frontend/src-tauri/Cargo.toml --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path frontend/src-tauri/Cargo.toml
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --locked --manifest-path frontend/src-tauri/Cargo.toml -- -D warnings
      - name: Disposable runner installer and process smoke
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force build/legacy | Out-Null
          gh release download v0.0.2 --repo $env:GITHUB_REPOSITORY --pattern RunePilotSetup-0.0.2.exe --dir build/legacy
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ((Get-FileHash -Algorithm SHA256 build/legacy/RunePilotSetup-0.0.2.exe).Hash -ne 'A037C439698614A02A2C4DD18052306C6DDF9548514AE44C57229B261A743E89') { throw 'Legacy fixture does not match the audited release' }
          $version = (& .\.venv\Scripts\python.exe tools/release_version.py --print).Trim()
          .\.venv\Scripts\python.exe tools/smoke_installer.py "dist/desktop/$version/RunePilotSetup-$version-x64.exe" --legacy build/legacy/RunePilotSetup-0.0.2.exe --previous build/upgrade-previous/dist/desktop/1.0.0-beta.1/RunePilotSetup-1.0.0-beta.1-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: RunePilot-Windows-x64
          path: dist/desktop/**
          if-no-files-found: error

  draft:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: RunePilot-Windows-x64
          path: release
      - name: Create reviewable draft only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'A release already exists. Review it manually; this workflow never overwrites releases.'
            exit 1
          fi
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          mapfile -d '' artifacts < <(find release -type f -print0)
          gh release create "$RELEASE_TAG" "${artifacts[@]}" --draft "${flags[@]}" --target "$SOURCE_SHA" --title "RunePilot $RELEASE_TAG" --notes 'Complete Windows x64 update; game settings are preserved. Manual Riot/League sign-in. Review installer migration and real League acceptance before publishing. Updates use the Tauri signature; Windows Authenticode is separate. Legacy Qt clients discover stable releases only. Publish the beta update feed separately after accepting a prerelease.'
