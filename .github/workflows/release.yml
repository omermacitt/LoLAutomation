name: Windows desktop beta

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact version tag from app_meta.py
        required: true
        default: v1.0.0-beta.1
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.3'
          cache: pip
          cache-dependency-path: requirements-build-windows.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22.15.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned Python build and test dependencies
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements-build-windows.lock
          .\.venv\Scripts\python.exe -m pip install --no-deps --no-build-isolation -e .
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Select Rust toolchain
        run: rustup override set 1.99.1
      - name: Verify release version and tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: .\.venv\Scripts\python.exe tools/release_version.py --tag $env:RELEASE_TAG
      - name: Python checks
        run: |
          .\.venv\Scripts\python.exe -m pytest
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m ruff check src tests main.py run_app.py backend_main.py tools/release_version.py tools/smoke_backend.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m black --check src tests main.py run_app.py backend_main.py tools/release_version.py tools/smoke_backend.py
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npx playwright install msedge
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run test:e2e
      - name: Build versioned Setup and verify frozen backend
        run: .\tools\build_desktop.ps1
      - name: Native Rust checks
        run: |
          cargo fmt --manifest-path frontend/src-tauri/Cargo.toml --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path frontend/src-tauri/Cargo.toml
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --locked --manifest-path frontend/src-tauri/Cargo.toml -- -D warnings
      - name: Disposable runner installer and process smoke
        run: |
          $version = (& .\.venv\Scripts\python.exe tools/release_version.py --print).Trim()
          .\.venv\Scripts\python.exe tools/smoke_installer.py "dist/desktop/$version/RunePilotSetup-$version-x64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: RunePilot-Windows-x64
          path: dist/desktop/**
          if-no-files-found: error

  draft:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: RunePilot-Windows-x64
          path: release
      - name: Create reviewable draft only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'A release already exists. Review it manually; this workflow never overwrites releases.'
            exit 1
          fi
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          mapfile -d '' artifacts < <(find release -type f -print0)
          gh release create "$RELEASE_TAG" "${artifacts[@]}" --draft "${flags[@]}" --target "$SOURCE_SHA" --title "RunePilot $RELEASE_TAG" --notes 'Windows x64 desktop preview. Manual Riot/League sign-in. Review clean Windows install, old-version migration and real League acceptance before publishing. Installer is not Authenticode signed; in-app updates are not enabled in this beta.'
