[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rune-pilot"
description = "League of Legends champion select, rune, spell and skin automation for Windows."
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "requests",
    "PyQt6",
    "win10toast",
]

[project.optional-dependencies]
dev = [
    "pyinstaller",
    "pytest",
    "httpx",
    "ruff",
    "black",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = { attr = "rune_pilot.shared.app_meta.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Başlangıç için makul bir çekirdek kural seti. Refactor ilerledikçe genişletilebilir.
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",   # satır uzunluğu (black yönetiyor)
    "B008",   # FastAPI Depends() gibi çağrı-varsayılanları
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
