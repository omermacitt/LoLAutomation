[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rune-pilot"
description = "League of Legends champion select, rune, spell and skin automation for Windows."
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "requests",
    "PyQt6",
    "win10toast",
]

[project.optional-dependencies]
dev = [
    "pyinstaller",
    "selenium",
    "pytest",
    "httpx",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = { attr = "rune_pilot.shared.app_meta.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
